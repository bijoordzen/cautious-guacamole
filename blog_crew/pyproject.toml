[project]
name = "blog_crew"
version = "0.1.0"
description = "blog_crew using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.30,<2.0.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
blog_crew = "blog_crew.main:run"
run_crew = "blog_crew.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "d3b64e4c-b904-414d-a0dd-e64c65288a6b"
